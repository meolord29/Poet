name: ci

on:
  pull_request:
  push:
    branches: [main, nightly]

permissions:
  contents: read

# Debug-incremental artifacts are pure disk waste in CI and filled the runner
# disk on run #1 (`No space left on device` → SIGBUS in ld, the dev-feature
# lane's second full debug rebuild). Incremental is only a local-dev feature.
env:
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # adr/0002: `main` is the frozen release branch — the only branch that may
  # merge into it is `nightly`. Fail any other PR targeting main, and (adr/0016)
  # require the promotion to carry exactly main's minor+1 at patch 0 — the
  # promote-bump bot lands it on PR open; this guard is the enforcement.
  guard:
    name: guard (only nightly merges into main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: assert head branch is nightly
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "nightly" ]; then
            echo "::error::main only accepts merges from the nightly branch (adr/0002); got '$HEAD_REF'"
            exit 1
          fi
      - name: assert the promotion bumps minor exactly (adr/0016)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          ver() { git show "$1:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1; }
          base=$(ver "$BASE_SHA"); head=$(ver "$HEAD_SHA")
          IFS='.' read -r bmaj bmin _ <<<"$base"
          expected="${bmaj}.$((bmin+1)).0"
          if [ "$head" != "$expected" ]; then
            echo "::error::promotion must carry exactly ${expected} (main is ${base}); got ${head}. The promote-bump bot does this on PR open — reopen the PR if it was missing."
            exit 1
          fi

  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: shellcheck installer
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The dev feature (adr/0015) must not rot: it is compiled and linted too.
      # (Poet-specific lane; xtask has no dev gating.)
      - name: clippy (dev feature)
        run: cargo clippy --all-targets --features dev -- -D warnings
      - name: test
        # The strict build runs the adr/0015 command gates via build.rs.
        run: cargo test --workspace
      - name: test (dev feature)
        run: cargo test --features dev
      - name: doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
